# FIX CHECKLIST (applied in source code, not here):
# 1. [HEARTBEAT] TianggeService.ensureFreshHeartbeat() runs before EVERY outbound call.
# 2. [STOCK SYNC] InventoryUpdatedEvent fires on reserveAll/restock/delivery events;
#    TianggeService.onInventoryUpdated actually pushes stock (no longer ignored).
# 3. [STOCK CORRELATION] After ACCEPTED decision, feed poller pushes stock for those SKUs
#    BEFORE returning so harness sees stock update correlated with the accepted order.
# 4. [FAST DECISIONS] Feed poll fixedDelay 500ms; decisions inline, no unnecessary waits.
# 5. [NO OVERSOLD] OrderService dedup + InventoryService pessimistic check (verify stock
#    after save within the same @Transactional) prevents race oversells.
# 6. [DEDUP] TianggeFeedPoller checks processedEventRepository.existsById(eventId) AS THE
#    VERY FIRST CHECK inside the event loop; only then reads orderId / type.
#    TianggeOrderRecord unique constraint + DataIntegrityViolationException catch.
# 7. [CANCELLATIONS] processOrderCancelled pushes ALL listed SKUs stock batch after confirm.
#    Confirmation retries 10x with aggressive backoff.
# 8. [BACKORDERS] BACKORDERED decision only sent AFTER supplier PO is confirmed SUBMITTED.
#    ensurePurchaseOrdersForProducts(submitNow=true) + hasActivePurchaseOrder recheck.
#    retryPendingBackorders every 2s catches fillable backorders.
# 9. [STABLE INSTANCE ID] .tiangge-instance-id file or INSTANCE_ID env reused on restart.
# 10. [RESTART TEST] schema.sql seed uses DO NOTHING so stock is NOT reset across restarts.

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
